org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental-compilation cache computes relative paths between the project dir
# and pub-cache/plugin source dirs — throws IllegalArgumentException ("different roots")
# when they're on different Windows drive letters (D: project, C: pub cache here).
# Incremental caching is a build-speed optimization only; disabling it just makes every
# build a clean compile, which is safe on a CI/one-off machine like this one.
kotlin.incremental=false
